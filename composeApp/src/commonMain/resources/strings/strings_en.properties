#Info
#Main
help_title=Help
help_subtitle=Detailed information about application features
help_toc_title=Table of Contents
help_section_users=Users
help_section_files=Files and Permissions
help_section_tools=System Tools
help_section_logs=Logging
help_subsection_create_user=Create User
help_create_user_desc=Creating a new user allows you to add an account to the system with the ability to set a password.
help_create_user_howto=How to create a user:
help_create_user_steps=1. Go to "Users" → "Create User"\n2. Enter username\n3. Specify password if needed\n4. Click "Create"
help_create_user_tips_title=Tips:
help_create_user_tips=• Usernames should not contain spaces\n• Complex passwords are recommended\n• System names (Admin, Administrator) are reserved
help_subsection_delete_user=Delete User
help_delete_user_desc=Deleting a user allows you to remove an account from the system and, if necessary, delete the user's folder.
help_delete_user_howto=How to delete a user:
help_delete_user_steps=1. Go to "Users" → "Delete User"\n2. Enter username\n3. Click "Delete"
help_delete_user_tips_title=Important:
help_delete_user_tips=• Deleting system user may lead to loss of system access\n• It's recommended to create a backup before deletion\n• User deletion doesn't automatically delete user files (requires admin rights)
help_subsection_change_password=Change Password
help_change_password_desc=Changing password allows you to update the password for an existing user, including setting an empty password.
help_change_password_howto=How to change password:
help_change_password_steps=1. Go to "Users" → "Change Password"\n2. Enter username\n3. Specify new password or set empty password\n4. Click "Change"
help_change_password_tips_title=Recommendations:
help_change_password_tips=• Don't use simple passwords\n• Empty password reduces system security\n• For system accounts, complex passwords are recommended
help_subsection_rename_user=Rename User
help_rename_user_desc=Rename user allows you to change the name of an existing account without losing data and settings.
help_rename_user_howto=How to rename a user:
help_rename_user_steps=1. Go to "Users" → "Rename User"\n2. Enter old username\n3. Enter new username\n4. Click "Rename"
help_rename_user_tips_title=Important notes:
help_rename_user_tips=• New name must be unique\n• System names (Admin, Administrator) cannot be used\n• The process doesn't affect user permissions and settings
help_section_coming_soon=Section in development. Detailed description will be added in future versions.

#User Account Status
help_subsection_toggle_user_status=User Account Status
help_toggle_user_status_desc=Temporarily suspend user access without deleting the account
help_toggle_user_status_howto=How to block/unblock a user:
help_toggle_user_status_steps=1. Go to "Users" → "Account Status"\n2. Enter username\n3. Click "Block" or "Unblock" button
help_toggle_user_status_tips_title=Tips:
help_toggle_user_status_tips=• Blocking temporarily suspends user access to the system\n• Unblocking restores access\n• Blocking does not delete the account or user data

#Manage Group Membership
help_subsection_manage_group_membership=Manage Group Membership
help_manage_group_membership_desc=Manage user membership in groups for access rights configuration
help_manage_group_membership_howto=How to manage group membership:
help_manage_group_membership_steps=1. Go to "Users" → "Group Management"\n2. Enter username\n3. Click "Load groups"\n4. Add or remove groups using buttons
help_manage_group_membership_tips_title=Tips:
help_manage_group_membership_tips=• Groups allow managing rights for multiple users simultaneously\n• Membership in groups simplifies rights management\n• Groups can be nested for complex scenarios

#Group Management
help_subsection_manage_groups=Group Management
help_manage_groups_desc=Create, delete and manage groups for access rights configuration
help_manage_groups_howto=How to manage groups:
help_manage_groups_steps=1. Go to "Users" → "Group Management"\n2. Enter group name\n3. Use "Create group" or "Delete group" buttons
help_manage_groups_tips_title=Tips:
help_manage_groups_tips=• Groups allow managing rights for multiple users simultaneously\n• Create groups for different roles (e.g., "Administrators", "Managers")\n• Delete unused groups to simplify management

#Files and Permissions
help_section_files=Files and Permissions
help_subsection_set_permissions=Set Permissions
help_set_permissions_desc=Setting permissions allows you to control user access to files and folders by setting read, write, and execute permissions.
help_set_permissions_howto=How to set permissions:
help_set_permissions_steps=1. Go to "Files and Permissions" → "Set Permissions"\n2. Enter username\n3. Specify path to file or folder\n4. Select required permissions\n5. Click "Confirm"
help_set_permissions_tips_title=Important notes:
help_set_permissions_tips=• Administrator rights are required to change permissions on system folders\n• Full access (F) includes all permissions\n• Be careful when assigning permissions to system folders

#View Permissions
help_subsection_view_permissions=View Permissions
help_view_permissions_desc=View current access permissions for a file or folder before modifying them
help_view_permissions_howto=How to view permissions:
help_view_permissions_steps=1. Go to "Files and Permissions" → "View Permissions"\n2. Specify path to file or folder\n3. Click "View" button
help_view_permissions_tips_title=Tips:
help_view_permissions_tips=• Viewing permissions helps avoid mistakes when modifying them\n• All permissions for each user and group are displayed\n• Current permissions are shown in a readable format

#Change Owner
help_subsection_change_owner=Change Owner
help_change_owner_desc=Change the owner of a file or folder to manage access rights
help_change_owner_howto=How to change owner:
help_change_owner_steps=1. Go to "Files and Permissions" → "Change Owner"\n2. Specify path to file or folder\n3. Enter username\n4. Click "Change" button
help_change_owner_tips_title=Important notes:
help_change_owner_tips=• Administrator rights are required to change owner\n• Ownership must be taken first\n• Changing owner may affect access permissions

#File Attributes
help_subsection_file_attributes=File Attributes
help_file_attributes_desc=View and change basic file attributes (read-only, hidden, system)
help_file_attributes_howto=How to manage file attributes:
help_file_attributes_steps=1. Go to "Files and Permissions" → "File Attributes"\n2. Specify path to file or folder\n3. Change required attributes\n4. Click "Apply" button
help_file_attributes_tips_title=Tips:
help_file_attributes_tips=• "Read-only" attribute protects file from accidental modification\n• Hidden files are not displayed in Explorer by default\n• System attributes are usually used for important system files

#System Tools

#System Tools
help_subsection_systemtools=System Tools
help_systemtools_desc=Additional system tools for diagnostics and configuration
help_systemtools_howto=How to use system tools:
help_systemtools_steps=1. Go to "System Tools" → "System Tools"\n2. Select the required tool\n3. Follow on-screen instructions
help_systemtools_tips_title=Tips:
help_systemtools_tips=• Some tools require administrator rights\n• Some tools are intended for experienced users\n• Create a restore point before using tools

help_section_tools=System Tools
help_subsection_taskmgr=Task Manager
help_taskmgr_desc=Task Manager allows you to manage running processes, applications, and services, as well as monitor system resource usage.
help_taskmgr_howto=How to open Task Manager:
help_taskmgr_steps=1. Click the "Open..." button in the main menu\n2. Select "Task Manager" from the list of tools\n3. Click "Confirm"
help_taskmgr_tips_title=Tips:
help_taskmgr_tips=• Task Manager can be opened with Ctrl+Shift+Esc\n• To end a frozen application, select it and click "End Task"\n• The "Performance" tab shows CPU, memory, and disk usage

help_subsection_regedit=Registry Editor
help_regedit_desc=Registry Editor provides access to the Windows registry where operating system and installed programs settings are stored.
help_regedit_howto=How to open Registry Editor:
help_regedit_steps=1. Click the "Open..." button in the main menu\n2. Select "Registry Editor" from the list of tools\n3. Click "Confirm"
help_regedit_tips_title=Warning:
help_regedit_tips=• Be careful when editing the registry — incorrect changes can disrupt system operation\n• It's recommended to create a restore point before making changes\n• Some registry sections are protected and require administrator rights

help_subsection_cleanmgr=Disk Cleanup
help_cleanmgr_desc=Disk Cleanup helps free up disk space by removing temporary files, cache, and other unnecessary data.
help_cleanmgr_howto=How to run Disk Cleanup:
help_cleanmgr_steps=1. Click the "Open..." button in the main menu\n2. Select "Disk Cleanup" from the list of tools\n3. Click "Confirm"
help_cleanmgr_tips_title=Recommendations:
help_cleanmgr_tips=• Regular disk cleanup improves system performance\n• You can select specific file types to delete\n• Cleaning system files requires administrator rights

help_subsection_diskmgmt=Disk Management
help_diskmgmt_desc=Disk Management provides tools for configuring hard disk partitions, managing volumes, and checking disk status.
help_diskmgmt_howto=How to open Disk Management:
help_diskmgmt_steps=1. Click the "Open..." button in the main menu\n2. Select "Disk Management" from the list of tools\n3. Click "Confirm"
help_diskmgmt_tips_title=Tips:
help_diskmgmt_tips=• It's recommended to create a backup before changing partitions\n• To extend a partition, unallocated space may be required\n• Changing the size of the system partition may require a reboot

#Services
help_subsection_services=Services
help_services_desc=Manage system services and their status
help_services_howto=How to manage services:
help_services_steps=1. Go to "System Tools" → "Services"\n2. Find the required service\n3. Use "Start", "Stop" or "Restart" buttons
help_services_tips_title=Tips:
help_services_tips=• Some services are critical for system operation\n• Do not stop services if you don't know their purpose\n• Double-click to change service parameters

#Event Viewer
help_subsection_eventvwr=Event Viewer
help_eventvwr_desc=View and analyze system events and errors
help_eventvwr_howto=How to view events:
help_eventvwr_steps=1. Go to "System Tools" → "Event Viewer"\n2. Select event log\n3. View events in the table\n4. Use filtering to find specific events
help_eventvwr_tips_title=Tips:
help_eventvwr_tips=• Critical events require immediate attention\n• Use filtering by severity level\n• Double-click on an event for detailed information

#Group Policy
help_subsection_gpp=Group Policy
help_gpp_desc=Configure security and organizational policies for managing computers on the network
help_gpp_howto=How to use group policy:
help_gpp_steps=1. Go to "System Tools" → "Group Policy"\n2. Select policy\n3. Configure parameters\n4. Apply policy
help_gpp_tips_title=Important notes:
help_gpp_tips=• Group policies are often used in corporate networks\n• Administrator rights are required for configuration\n• Changes may require a restart

#Computer Management
help_subsection_computermanagement1=Computer Management
help_computermanagement1_desc=Unified interface for system management
help_computermanagement1_howto=How to use computer management:
help_computermanagement1_steps=1. Go to "System Tools" → "Computer Management"\n2. Select required section\n3. Perform necessary actions
help_computermanagement1_tips_title=Tips:
help_computermanagement1_tips=• This tool provides access to many system settings\n• Administrator rights are required for most actions\n• Be careful when changing system parameters

#Task Scheduler
help_subsection_taskscheduler=Task Scheduler
help_taskscheduler_desc=Create and manage automatic tasks that run on schedule or in response to events
help_taskscheduler_howto=How to use task scheduler:
help_taskscheduler_steps=1. Go to "System Tools" → "Task Scheduler"\n2. Create a new task or select an existing one\n3. Configure triggers (time to run or events)\n4. Configure actions (what should happen)\n5. Configure additional settings (if necessary)
help_taskscheduler_tips_title=Tips:
help_taskscheduler_tips=• Use scheduler for regular backup tasks\n• Tasks can run even when no user is logged in\n• Regularly check task status to track errors

#Device Manager
help_subsection_devicemgr=Device Manager
help_devicemgr_desc=Manage devices, drivers, and hardware components
help_devicemgr_howto=How to use device manager:
help_devicemgr_steps=1. Go to "System Tools" → "Device Manager"\n2. Find required device\n3. Use context menu for actions
help_devicemgr_tips_title=Tips:
help_devicemgr_tips=• Check for driver updates regularly\n• When having problems with a device, try updating the driver\n• Driver rollback can help when problems occur

#Firewall
help_subsection_firewall=Firewall
help_firewall_desc=Manage network security and firewall rules
help_firewall_howto=How to use firewall:
help_firewall_steps=1. Go to "System Tools" → "Firewall"\n2. Select network profile\n3. Configure rules for incoming and outgoing connections
help_firewall_tips_title=Important notes:
help_firewall_tips=• Firewall protects the system from unwanted connections\n• Some programs may require open ports\n• Be careful when changing firewall rules

#Logging
help_section_logs=Logging
help_subsection_view_logs=View Logs
help_view_logs_desc=Logging records all important actions in the system, allowing you to track changes and diagnose problems.
help_view_logs_howto=How to view logs:
help_view_logs_steps=1. Go to "Settings"\n2. Click "Open log folder"\n3. Open the usermanager.log file in a text editor
help_view_logs_tips_title=Tips:
help_view_logs_tips=• Logs are stored in the .usermanager folder in the home directory\n• Each entry contains date, time, and severity level\n• For easier analysis, you can export logs to CSV

help_subsection_export_logs=Export Logs
help_export_logs_desc=Log export allows you to save records in CSV format for further analysis in Excel or other applications.
help_export_logs_howto=How to export logs:
help_export_logs_steps=1. Go to "Settings"\n2. Click "Export logs to CSV"\n3. Open the created file in Excel
help_export_logs_tips_title=Additional:
help_export_logs_tips=• The exported file contains columns: Timestamp, Level, Message\n• You can filter entries by severity level (INFO, WARNING, ERROR)\n• For regular export, you can create an automated task

#Security Policy
help_subsection_security_policy=Security Policy
help_security_policy_desc=Configure security policies for user accounts
help_security_policy_howto=How to configure security policies:
help_security_policy_steps=1. Go to "Information Security" → "Main"\n2. Enter username\n3. Click "Load" button\n4. Configure security policy parameters\n5. Click "Save" button
help_security_policy_tips_title=Tips:
help_security_policy_tips=• Security policies are applied at the system level, not for individual users\n• Policy changes affect all users of the system\n• Administrator rights are required to apply policies

#Suspicious Activity Analysis
help_subsection_suspicious_activity=Suspicious Activity Analysis
help_suspicious_activity_desc=Detect and analyze suspicious activities in the system
help_suspicious_activity_howto=How to use suspicious activity analysis:
help_suspicious_activity_steps=1. Go to "Information Security" → "Suspicious Activity Analysis"\n2. Click "Scan" button\n3. Review found events\n4. Apply filtering if necessary
help_suspicious_activity_tips_title=Tips:
help_suspicious_activity_tips=• System log analysis helps detect hacking attempts\n• Critical events require immediate attention\n• Regular log analysis is an important part of security assurance

help_back=Back







