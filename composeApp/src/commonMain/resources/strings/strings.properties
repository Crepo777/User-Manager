#Future Plans
ui_future_plans_title=Планы на будущее
ui_future_plans_subtitle=Будущее развитие приложения
ui_future_plan1_title=Добавить больше функций информационной безопасности
ui_future_plan1_desc=В будущих версиях будут добавлены:\n\n1) Расширенный анализ уязвимостей системы с возможностью автоматического сканирования на наличие известных уязвимостей и рекомендаций по их устранению\n\n2) Система предупреждения о фишинге, которая будет анализировать входящие электронные письма и предупреждать о подозрительных ссылках и вложениях\n\n3) Интеграция с антивирусными решениями для централизованного мониторинга и управления защитой системы
ui_future_plan2_title=Портирование приложения для Linux
ui_future_plan2_desc=Планируется адаптация приложения для работы в Linux-среде, что значительно расширит его аудиторию. Это позволит системным администраторам использовать мой инструмент безопасности на серверах и рабочих станциях с Linux. Портирование будет выполнено с сохранением основного функционала и адаптацией под особенности Linux-систем.
ui_future_plan3_title=Создание единой системы компьютеров через приложение
ui_future_plan3_desc=Один компьютер будет выступать в роли Хоста и сможет управлять другими устройствами, на которых установлено приложение. Хост будет иметь возможность централизованно управлять политиками безопасности, просматривать логи и проводить анализ безопасности для всей сети. Эта функция особенно полезна для малых и средних предприятий, которые хотят иметь централизованное управление безопасностью без сложных корпоративных решений.
ui_future_plan4_title=Привлечение внимания с помощью соцсетей
ui_future_plan4_desc=Я планирую активно использовать социальные сети для информирования пользователей о новых функциях, обучающих материалах и советах по информационной безопасности. Регулярные публикации, видео-руководства и интерактивные сессии помогут создать сообщество вокруг приложения и повысить осведомленность пользователей о важности информационной безопасности.
ui_future_plan5_title=Доработка UMAI
ui_future_plan5_desc=Я планирую доработать UMAI (Искусственный Интеллект User Manager) для более простого управления устройствами. Однако на это потребуется время, так как нужно натренировать модель, чтобы она правильно выполняла запросы.



