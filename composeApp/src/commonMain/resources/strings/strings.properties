#Main
help_title=Справка
help_subtitle=Подробная информация о функциях приложения
help_toc_title=Содержание
help_section_users=Пользователи
help_section_files=Файлы и права
help_section_tools=Системные утилиты
help_section_logs=Логирование
help_subsection_create_user=Создание пользователя
help_create_user_desc=Создание нового пользователя позволяет добавить учетную запись в систему с возможностью установки пароля.
help_create_user_howto=Как создать пользователя:
help_create_user_steps=1. Перейдите в раздел "Пользователи" → "Создать пользователя"\n2. Введите имя пользователя\n3. При необходимости укажите пароль\n4. Нажмите кнопку "Создать"
help_create_user_tips_title=Советы:
help_create_user_tips=• Имена пользователей не должны содержать пробелов\n• Рекомендуется использовать сложные пароли\n• Системные имена (Admin, Administrator) зарезервированы
help_subsection_delete_user=Удаление пользователя
help_delete_user_desc=Удаление пользователя позволяет удалить учетную запись из системы, а также, при необходимости, удалить папку пользователя.
help_delete_user_howto=Как удалить пользователя:
help_delete_user_steps=1. Перейдите в раздел "Пользователи" → "Удалить пользователя"\n2. Введите имя пользователя\n3. Нажмите кнопку "Удалить"
help_delete_user_tips_title=Важно:
help_delete_user_tips=• Удаление системного пользователя может привести к потере доступа к системе\n• Перед удалением рекомендуется создать резервную копию\n• Удаление пользователя не удаляет его файлы автоматически (требуются права администратора)
help_subsection_change_password=Изменение пароля
help_change_password_desc=Изменение пароля позволяет обновить пароль для существующего пользователя, включая установку пустого пароля.
help_change_password_howto=Как изменить пароль:
help_change_password_steps=1. Перейдите в раздел "Пользователи" → "Изменить пароль"\n2. Введите имя пользователя\n3. Укажите новый пароль или установите пустой пароль\n4. Нажмите кнопку "Изменить"
help_change_password_tips_title=Рекомендации:
help_change_password_tips=• Не используйте простые пароли\n• Пустой пароль снижает безопасность системы\n• Для системных учетных записей рекомендуется использовать сложные пароли
help_subsection_rename_user=Переименование пользователя
help_rename_user_desc=Переименование пользователя позволяет изменить имя существующей учетной записи без потери данных и настроек.
help_rename_user_howto=Как переименовать пользователя:
help_rename_user_steps=1. Перейдите в раздел "Пользователи" → "Переименовать пользователя"\n2. Введите старое имя пользователя\n3. Введите новое имя пользователя\n4. Нажмите кнопку "Переименовать"
help_rename_user_tips_title=Важные замечания:
help_rename_user_tips=• Новое имя должно быть уникальным\n• Системные имена (Admin, Administrator) нельзя использовать\n• Процесс не влияет на права и настройки пользователя

#Блокировка/Разблокировка пользователя
help_subsection_toggle_user_status=Блокировка/Разблокировка пользователя
help_toggle_user_status_desc=Временно приостановите доступ пользователя без удаления учетной записи
help_toggle_user_status_howto=Как заблокировать/разблокировать пользователя:
help_toggle_user_status_steps=1. Перейдите в раздел "Пользователи" → "Блокировка/Разблокировка"\n2. Введите имя пользователя\n3. Нажмите кнопку "Заблокировать" или "Разблокировать"
help_toggle_user_status_tips_title=Советы:
help_toggle_user_status_tips=• Блокировка пользователя временно приостанавливает его доступ к системе\n• Разблокировка восстанавливает доступ\n• Блокировка не удаляет учетную запись и данные пользователя

#Управление членством в группах
help_subsection_manage_group_membership=Управление членством в группах
help_manage_group_membership_desc=Управление членством пользователя в группах для настройки прав доступа
help_manage_group_membership_howto=Как управлять членством в группах:
help_manage_group_membership_steps=1. Перейдите в раздел "Пользователи" → "Управление группами"\n2. Введите имя пользователя\n3. Нажмите "Загрузить группы"\n4. Добавляйте или удаляйте группы с помощью кнопок
help_manage_group_membership_tips_title=Советы:
help_manage_group_membership_tips=• Группы позволяют управлять правами для нескольких пользователей одновременно\n• Членство в группах упрощает управление правами\n• Группы могут быть вложенными для сложных сценариев

#Управление группами
help_subsection_manage_groups=Управление группами
help_manage_groups_desc=Создание, удаление и управление группами для настройки прав доступа
help_manage_groups_howto=Как управлять группами:
help_manage_groups_steps=1. Перейдите в раздел "Пользователи" → "Управление группами"\n2. Введите имя группы\n3. Используйте кнопки "Создать группу" или "Удалить группу"
help_manage_groups_tips_title=Советы:
help_manage_groups_tips=• Группы позволяют управлять правами для нескольких пользователей одновременно\n• Создавайте группы для разных ролей (например, "Администраторы", "Менеджеры")\n• Удаляйте неиспользуемые группы для упрощения управления

#Управление файлами и правами
help_section_files=Файлы и права
help_subsection_set_permissions=Назначение прав
help_set_permissions_desc=Назначение прав позволяет контролировать доступ пользователей к файлам и папкам, устанавливая разрешения на чтение, запись и выполнение.
help_set_permissions_howto=Как назначить права:
help_set_permissions_steps=1. Перейдите в раздел "Файлы и права" → "Назначить права"\n2. Введите имя пользователя\n3. Укажите путь к файлу или папке\n4. Выберите необходимые разрешения\n5. Нажмите кнопку "Подтвердить"
help_set_permissions_tips_title=Важные замечания:
help_set_permissions_tips=• Для изменения прав на системных папках требуются права администратора\n• Полный доступ (F) включает все разрешения\n• Будьте осторожны при назначении прав системным папкам

#Просмотр прав доступа
help_subsection_view_permissions=Просмотр прав доступа
help_view_permissions_desc=Посмотрите текущие права доступа для файла или папки перед их изменением
help_view_permissions_howto=Как просмотреть права доступа:
help_view_permissions_steps=1. Перейдите в раздел "Файлы и права" → "Просмотр прав доступа"\n2. Укажите путь к файлу или папке\n3. Нажмите кнопку "Просмотреть"
help_view_permissions_tips_title=Советы:
help_view_permissions_tips=• Просмотр прав помогает избежать ошибок при их изменении\n• Отображаются все разрешения для каждого пользователя и группы\n• Текущие права отображаются в удобочитаемом формате

#Изменить владельца
help_subsection_change_owner=Изменить владельца
help_change_owner_desc=Измените владельца файла или папки для управления правами доступа
help_change_owner_howto=Как изменить владельца:
help_change_owner_steps=1. Перейдите в раздел "Файлы и права" → "Изменить владельца"\n2. Укажите путь к файлу или папке\n3. Введите имя пользователя\n4. Нажмите кнопку "Изменить"
help_change_owner_tips_title=Важные замечания:
help_change_owner_tips=• Для изменения владельца требуются права администратора\n• Сначала необходимо получить владение файлом\n• Изменение владельца может повлиять на права доступа

#Атрибуты файла
help_subsection_file_attributes=Атрибуты файла
help_file_attributes_desc=Просмотр и изменение базовых атрибутов файла (только для чтения, скрытый, системный)
help_file_attributes_howto=Как управлять атрибутами файла:
help_file_attributes_steps=1. Перейдите в раздел "Файлы и права" → "Атрибуты файла"\n2. Укажите путь к файлу или папке\n3. Измените необходимые атрибуты\n4. Нажмите кнопку "Применить"
help_file_attributes_tips_title=Советы:
help_file_attributes_tips=• Атрибут "Только для чтения" защищает файл от случайного изменения\n• Скрытые файлы не отображаются в проводнике по умолчанию\n• Системные атрибуты обычно используются для важных системных файлов

#Системные утилиты

#Системные инструменты
help_subsection_systemtools=Системные инструменты
help_systemtools_desc=Дополнительные системные инструменты для диагностики и настройки
help_systemtools_howto=Как использовать системные инструменты:
help_systemtools_steps=1. Перейдите в раздел "Системные утилиты" → "Системные инструменты"\n2. Выберите нужный инструмент\n3. Следуйте инструкциям на экране
help_systemtools_tips_title=Советы:
help_systemtools_tips=• Инструменты могут требовать прав администратора\n• Некоторые инструменты предназначены для опытных пользователей\n• Перед использованием инструментов рекомендуется создать точку восстановления

help_section_tools=Системные утилиты
help_subsection_taskmgr=Диспетчер задач
help_taskmgr_desc=Диспетчер задач позволяет управлять запущенными процессами, приложениями и службами, а также просматривать использование системных ресурсов.
help_taskmgr_howto=Как открыть Диспетчер задач:
help_taskmgr_steps=1. Нажмите на кнопку "Открыть..." в главном меню\n2. Выберите "Диспетчер задач" из списка утилит\n3. Нажмите кнопку "Подтвердить"
help_taskmgr_tips_title=Советы:
help_taskmgr_tips=• Диспетчер задач можно открыть сочетанием клавиш Ctrl+Shift+Esc\n• Для завершения зависшего приложения выберите его и нажмите "Завершить задачу"\n• Во вкладке "Производительность" можно отслеживать использование CPU, памяти и диска

help_subsection_regedit=Редактор реестра
help_regedit_desc=Редактор реестра предоставляет доступ к системному реестру Windows, где хранятся настройки операционной системы и установленных программ.
help_regedit_howto=Как открыть Редактор реестра:
help_regedit_steps=1. Нажмите на кнопку "Открыть..." в главном меню\n2. Выберите "Редактор реестра" из списка утилит\n3. Нажмите кнопку "Подтвердить"
help_regedit_tips_title=Предупреждение:
help_regedit_tips=• Будьте осторожны при редактировании реестра — неправильные изменения могут нарушить работу системы\n• Перед внесением изменений рекомендуется создать точку восстановления\n• Некоторые разделы реестра защищены и требуют прав администратора

help_subsection_cleanmgr=Очистка диска
help_cleanmgr_desc=Очистка диска позволяет освободить место на диске, удаляя временные файлы, кэш и другие ненужные данные.
help_cleanmgr_howto=Как запустить Очистку диска:
help_cleanmgr_steps=1. Нажмите на кнопку "Открыть..." в главном меню\n2. Выберите "Очистка диска" из списка утилит\n3. Нажмите кнопку "Подтвердить"
help_cleanmgr_tips_title=Рекомендации:
help_cleanmgr_tips=• Регулярная очистка диска улучшает производительность системы\n• Можно выбрать конкретные типы файлов для удаления\n• Очистка системных файлов требует прав администратора

help_subsection_diskmgmt=Управление дисками
help_diskmgmt_desc=Управление дисками предоставляет инструменты для настройки разделов жесткого диска, управления томами и проверки состояния дисков.
help_diskmgmt_howto=Как открыть Управление дисками:
help_diskmgmt_steps=1. Нажмите на кнопку "Открыть..." в главном меню\n2. Выберите "Управление дисками" из списка утилит\n3. Нажмите кнопку "Подтвердить"
help_diskmgmt_tips_title=Советы:
help_diskmgmt_tips=• Перед изменением разделов рекомендуется создать резервную копию данных\n• Для расширения раздела может потребоваться освободить нераспределенное пространство\n• Изменение размера системного раздела может потребовать перезагрузки

#Службы
help_subsection_services=Службы
help_services_desc=Управление системными службами и их состоянием
help_services_howto=Как управлять службами:
help_services_steps=1. Перейдите в раздел "Системные утилиты" → "Службы"\n2. Найдите нужную службу\n3. Используйте кнопки "Запустить", "Остановить" или "Перезапустить"
help_services_tips_title=Советы:
help_services_tips=• Некоторые службы критически важны для работы системы\n• Не останавливайте службы, если не знаете их назначения\n• Для изменения параметров службы нажмите двойным кликом

#Просмотр событий
help_subsection_eventvwr=Просмотр событий
help_eventvwr_desc=Просмотр и анализ системных событий и ошибок
help_eventvwr_howto=Как просматривать события:
help_eventvwr_steps=1. Перейдите в раздел "Системные утилиты" → "Просмотр событий"\n2. Выберите журнал событий\n3. Просмотрите события в таблице\n4. Используйте фильтрацию для поиска нужных событий
help_eventvwr_tips_title=Советы:
help_eventvwr_tips=• События уровня "Критическая" требуют немедленного внимания\n• Используйте фильтрацию по уровню важности\n• Для подробной информации дважды кликните на событие

#Групповые политики
help_subsection_gpp=Групповые политики
help_gpp_desc=Настройка политик безопасности и организации для управления компьютерами в сети
help_gpp_howto=Как использовать групповые политики:
help_gpp_steps=1. Перейдите в раздел "Системные утилиты" → "Групповые политики"\n2. Выберите политику\n3. Настройте параметры\n4. Примените политику
help_gpp_tips_title=Важные замечания:
help_gpp_tips=• Групповые политики часто используются в корпоративных сетях\n• Требуются права администратора для настройки\n• Изменения могут потребовать перезагрузки

#Управление компьютером
help_subsection_computermanagement1=Управление компьютером
help_computermanagement1_desc=Единый интерфейс для управления системой
help_computermanagement1_howto=Как использовать управление компьютером:
help_computermanagement1_steps=1. Перейдите в раздел "Системные утилиты" → "Управление компьютером"\n2. Выберите нужный раздел\n3. Выполните необходимые действия
help_computermanagement1_tips_title=Советы:
help_computermanagement1_tips=• Этот инструмент предоставляет доступ ко многим системным настройкам\n• Требуются права администратора для большинства действий\n• Будьте осторожны при изменении системных параметров

#Планировщик задач
help_subsection_taskscheduler=Планировщик задач
help_taskscheduler_desc=Создание и управление автоматическими задачами, которые запускаются по расписанию или при событиях
help_taskscheduler_howto=Как использовать планировщик задач:
help_taskscheduler_steps=1. Перейдите в раздел "Системные утилиты" → "Планировщик задач"\n2. Создайте новую задачу или выберите существующую\n3. Настройте триггеры (время запуска или события)\n4. Настройте действия (что должно происходить)\n5. Настройте дополнительные параметры (если необходимо)
help_taskscheduler_tips_title=Советы:
help_taskscheduler_tips=• Используйте планировщик для регулярного резервного копирования\n• Задачи могут запускаться даже когда пользователь не вошел в систему\n• Регулярно проверяйте состояние задач для отслеживания ошибок

#Диспетчер устройств
help_subsection_devicemgr=Диспетчер устройств
help_devicemgr_desc=Управление устройствами, драйверами и аппаратными компонентами
help_devicemgr_howto=Как использовать диспетчер устройств:
help_devicemgr_steps=1. Перейдите в раздел "Системные утилиты" → "Диспетчер устройств"\n2. Найдите нужное устройство\n3. Используйте контекстное меню для действий
help_devicemgr_tips_title=Советы:
help_devicemgr_tips=• Проверяйте обновления драйверов регулярно\n• При проблемах с устройством попробуйте обновить драйвер\n• Откат драйвера может помочь при возникновении проблем

#Брандмауэр
help_subsection_firewall=Брандмауэр
help_firewall_desc=Управление сетевой безопасностью и правилами брандмауэра
help_firewall_howto=Как использовать брандмауэр:
help_firewall_steps=1. Перейдите в раздел "Системные утилиты" → "Брандмауэр"\n2. Выберите профиль сети\n3. Настройте правила для входящих и исходящих соединений
help_firewall_tips_title=Важные замечания:
help_firewall_tips=• Брандмауэр защищает систему от нежелательных подключений\n• Некоторые программы могут требовать открытия портов\n• Будьте осторожны при изменении правил брандмауэра

#Логирование
help_section_logs=Логирование
help_subsection_view_logs=Просмотр логов
help_view_logs_desc=Логирование фиксирует все важные действия в системе, что позволяет отслеживать изменения и диагностировать проблемы.
help_view_logs_howto=Как просмотреть логи:
help_view_logs_steps=1. Перейдите в раздел "Настройки"\n2. Нажмите кнопку "Открыть папку с логами"\n3. Откройте файл usermanager.log в текстовом редакторе
help_view_logs_tips_title=Советы:
help_view_logs_tips=• Логи хранятся в папке .usermanager в домашней директории\n• Каждая запись содержит дату, время и уровень важности\n• Для удобного анализа можно экспортировать логи в CSV

help_subsection_export_logs=Экспорт логов
help_export_logs_desc=Экспорт логов позволяет сохранить записи в формате CSV для дальнейшего анализа в Excel или других приложениях.
help_export_logs_howto=Как экспортировать логи:
help_export_logs_steps=1. Перейдите в раздел "Настройки"\n2. Нажмите кнопку "Экспортировать логи в CSV"\n3. Откройте созданный файл в Excel
help_export_logs_tips_title=Дополнительно:
help_export_logs_tips=• Экспортированный файл содержит столбцы: Дата-время, Уровень, Сообщение\n• Можно фильтровать записи по уровню важности (INFO, WARNING, ERROR)\n• Для регулярного экспорта можно создать автоматическую задачу
help_section_coming_soon=Раздел в разработке. Подробное описание будет добавлено в следующих версиях.

#Политика безопасности
help_subsection_security_policy=Политика безопасности
help_security_policy_desc=Настройка политик безопасности для учетных записей
help_security_policy_howto=Как настроить политики безопасности:
help_security_policy_steps=1. Перейдите в раздел "Информационная безопасность" → "Основное"\n2. Введите имя пользователя\n3. Нажмите кнопку "Загрузить"\n4. Настройте параметры политик безопасности\n5. Нажмите кнопку "Сохранить"
help_security_policy_tips_title=Советы:
help_security_policy_tips=• Политики безопасности применяются на уровне системы, а не для отдельного пользователя\n• Изменения политик затрагивают всех пользователей системы\n• Для применения политик требуются права администратора

#Анализ подозрительной активности
help_subsection_suspicious_activity=Анализ подозрительной активности
help_suspicious_activity_desc=Обнаружение и анализ подозрительных действий в системе
help_suspicious_activity_howto=Как использовать анализ подозрительной активности:
help_suspicious_activity_steps=1. Перейдите в раздел "Информационная безопасность" → "Анализ подозрительной активности"\n2. Нажмите кнопку "Сканировать"\n3. Просмотрите найденные события\n4. При необходимости примените фильтрацию
help_suspicious_activity_tips_title=Советы:
help_suspicious_activity_tips=• Анализ системных логов помогает обнаружить попытки взлома\n• Критические события требуют немедленного внимания\n• Регулярный анализ логов - важная часть обеспечения безопасности

#Проверка соответствия стандартам
help_subsection_compliance_check=Проверка соответствия стандартам
help_compliance_check_desc=Проверка соответствия политик безопасности системным стандартам (CIS, NIST, PCI DSS). Помогает выявить несоответствия и предоставляет рекомендации по улучшению безопасности.
help_compliance_check_howto=Как использовать проверку соответствия:
help_compliance_check_steps=1. Перейдите в раздел "Информационная безопасность" → "Проверка соответствия"\n2. Выберите стандарт (CIS Benchmark, NIST 800-53 или PCI DSS)\n3. Нажмите кнопку "Проверить соответствие"\n4. Проанализируйте результаты и рекомендации\n5. При необходимости примените рекомендации для улучшения безопасности
help_compliance_check_tips_title=Советы:
help_compliance_check_tips=• Проверяйте соответствие регулярно для поддержания высокого уровня безопасности\n• Критические ошибки требуют немедленного исправления\n• Некоторые стандарты могут не полностью применяться к вашей версии Windows\n• После применения рекомендаций повторите проверку для подтверждения соответствия
help_compliance_check_more_title=Подробнее о стандартах:

help_back=Назад




